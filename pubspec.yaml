name: envx
description: >-
  Layered appsettings-style configuration for Dart and Flutter, with JSON,
  dotenv, environment overrides, typed values, and validation.
version: 2.0.1
repository: https://github.com/arlamend7/dart_envx
homepage: https://github.com/arlamend7/dart_envx
documentation: https://arlamend7.github.io/dart_envx/
issue_tracker: https://github.com/arlamend7/dart_envx/issues

# Runnable entry point. pub.dev discovers example/README.md for its Example tab.
example: example/envx_example.dart

topics:
  - configuration
  - environment
  - json
  - dotenv

# Pure Dart core; Flutter is not required. Native adapters use envx_io.dart.
environment:
  sdk: '>=3.0.0 <4.0.0'

# No runtime dependencies. Resolve SDK-compatible development tools on Dart 3.0+.
dev_dependencies:
  lints: '>=2.1.1 <7.0.0'
  test: ^1.24.0
