name: Validate package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ['3.0.7', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/minimal_example.dart
      - run: dart run example/envx_example.dart
      - run: dart run -DENVIRONMENT=production example/envx_example.dart
      - run: dart run example/configuration_example.dart
      - name: Compile core for web
        run: dart compile js -DAPP_ENV=prod -DCUSTOM_ENV=prod tool/compile_smoke.dart -o smoke.js
      - name: Compile and run AOT environment regression
        if: runner.os != 'Windows'
        run: |
          dart compile exe -DAPP_ENV=prod -DCUSTOM_ENV=prod tool/compile_smoke.dart -o /tmp/envx-smoke
          /tmp/envx-smoke
      - name: Browser core tests
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
        run: dart test --platform chrome test/config_test.dart test/envx_test.dart test/legacy_regression_test.dart

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart pub publish --dry-run
      - run: dart pub global activate pana
      - name: Require all 160 PANA points
        run: |
          dart pub global run pana --exit-code-threshold 0 --json . > pana-report.json
          python3 -c "import json; r=json.load(open('pana-report.json')); s=r['scores']; assert s['grantedPoints'] == s['maxPoints'] == 160, s"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pana-report
          path: pana-report.json
